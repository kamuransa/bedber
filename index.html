<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bedber">
<title>Bedber Randevu</title>
<style>
:root{--bg:#0f0f10;--card:#1a1a1c;--line:#2a2a2d;--txt:#f4f1ea;--mut:#9a968e;--gold:#d4a24c;--ok:#4caf7a;--red:#e05a4f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding-bottom:110px}
header{padding:22px 18px 10px;padding-top:calc(22px + env(safe-area-inset-top))}
.brand{font-size:13px;letter-spacing:3px;color:var(--gold);text-transform:uppercase}
h1{margin:4px 0 0;font-size:24px}
.tabs{display:flex;gap:8px;padding:8px 18px;position:sticky;top:0;background:var(--bg);z-index:5}
.tab{flex:1;padding:10px;border:1px solid var(--line);border-radius:12px;background:none;color:var(--mut);font-size:15px}
.tab.on{background:var(--gold);color:#111;border-color:var(--gold);font-weight:600}
.days{display:flex;gap:8px;overflow-x:auto;padding:10px 18px}
.day{min-width:56px;padding:8px 6px;border-radius:12px;background:var(--card);border:1px solid var(--line);text-align:center;color:var(--mut);font-size:12px}
.day b{display:block;font-size:18px;color:var(--txt)}
.day.on{border-color:var(--gold);color:var(--gold)}
.list{padding:6px 18px}
.appt{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.time{font-size:20px;font-weight:700;min-width:62px}
.info{flex:1;min-width:0}
.name{font-size:16px}
.sub{font-size:13px;color:var(--mut)}
.paid{color:var(--ok);font-weight:600}
.btn{border:none;border-radius:10px;padding:9px 12px;font-size:14px;background:#2a2a2d;color:var(--txt)}
.btn.g{background:var(--gold);color:#111;font-weight:600}
.btn.w{background:#1f6f43}
.empty{color:var(--mut);text-align:center;padding:40px 10px}
.fabs{position:fixed;left:0;right:0;bottom:0;display:flex;gap:12px;justify-content:center;align-items:center;padding:14px;padding-bottom:calc(14px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 40%)}
.mic{width:70px;height:70px;border-radius:50%;border:none;background:var(--gold);font-size:30px;box-shadow:0 6px 20px rgba(212,162,76,.35)}
.mic.rec{background:var(--red);animation:p 1s infinite}
@keyframes p{50%{transform:scale(1.08)}}
.plus{width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--txt);font-size:26px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.stat .v{font-size:22px;font-weight:700;color:var(--gold);margin-top:4px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:flex-end;z-index:20}
.modal.on{display:flex}
.sheet{background:#161618;width:100%;border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 12px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input{width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--txt);font-size:17px}
.row{display:flex;gap:10px;margin-top:16px}.row .btn{flex:1;padding:14px}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--gold);padding:12px 16px;border-radius:12px;display:none;z-index:30;max-width:90%;text-align:center}
.hint{font-size:12px;color:var(--mut);text-align:center;padding:4px 18px}
.small{font-size:12px;color:var(--mut);padding:16px 18px}
.small button{margin-right:8px}
</style>
</head>
<body>
<header><div class="brand">Bedber Erkek Kuaförü</div><h1 id="title">Randevular</h1></header>
<div class="tabs"><button class="tab on" data-v="r">Randevular</button><button class="tab" data-v="k">Kasa</button></div>

<section id="vr">
  <div class="days" id="days"></div>
  <div class="hint">🎤 Mikrofona bas: “yarın saat 8'e Ahmet” de, randevu hazır.</div>
  <div class="list" id="list"></div>
</section>

<section id="vk" style="display:none">
  <div class="stats">
    <div class="stat"><div class="sub">Bugün</div><div class="v" id="sT">0 ₺</div></div>
    <div class="stat"><div class="sub">Bu hafta</div><div class="v" id="sW">0 ₺</div></div>
    <div class="stat"><div class="sub">Bu ay</div><div class="v" id="sM">0 ₺</div></div>
    <div class="stat"><div class="sub">Bu ay randevu</div><div class="v" id="sC">0</div></div>
  </div>
  <div class="list" id="hist"></div>
  <div class="small"><button class="btn" id="exp">Yedek al</button><button class="btn" id="imp">Yedekten yükle</button><input type="file" id="file" accept=".json" style="display:none"></div>
</section>

<div class="fabs"><button class="plus" id="add">＋</button><button class="mic" id="mic">🎤</button></div>

<div class="modal" id="mAdd"><div class="sheet">
  <h3 id="mT">Yeni randevu</h3>
  <label>Tarih</label><input type="date" id="fD">
  <label>Saat</label><input type="time" id="fH" step="300">
  <label>Müşteri (isteğe bağlı)</label><input id="fN" placeholder="Ahmet">
  <label>Telefon (WhatsApp hatırlatma için, isteğe bağlı)</label><input id="fP" type="tel" placeholder="05xx xxx xx xx">
  <div class="row"><button class="btn" id="del" style="display:none;background:var(--red)">Sil</button><button class="btn" data-close>Vazgeç</button><button class="btn g" id="save">Kaydet</button></div>
</div></div>

<div class="modal" id="mPay"><div class="sheet">
  <h3>Alınan tutar</h3><div class="sub" id="payWho"></div>
  <label>Tutar (₺)</label><input id="fA" type="number" inputmode="decimal" placeholder="0">
  <div class="row"><button class="btn" data-close>Vazgeç</button><button class="btn g" id="paySave">Kaydet</button></div>
</div></div>

<div class="toast" id="toast"></div>

<script>
const K='bedber_v1';
let db=JSON.parse(localStorage.getItem(K)||'{"a":[]}');
const save=()=>localStorage.setItem(K,JSON.stringify(db));
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const tl=n=>(Math.round(n*100)/100).toLocaleString('tr-TR')+' ₺';
const GUN=['Paz','Pzt','Sal','Çar','Per','Cum','Cmt'];
let sel=ymd(new Date()),editId=null,payId=null;
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',2600)}

function renderDays(){
  const w=$('#days');w.innerHTML='';const b=new Date();b.setDate(b.getDate()-1);
  for(let i=0;i<15;i++){const d=new Date(b);d.setDate(b.getDate()+i);const k=ymd(d);
    const n=db.a.filter(x=>x.d===k).length;
    const el=document.createElement('button');el.className='day'+(k===sel?' on':'');
    el.innerHTML=(i===1?'Bugün':GUN[d.getDay()])+'<b>'+d.getDate()+'</b>'+(n?n+' rnd':'&nbsp;');
    el.onclick=()=>{sel=k;render()};w.appendChild(el)}
}
function renderList(){
  const L=$('#list');const a=db.a.filter(x=>x.d===sel).sort((p,q)=>p.h.localeCompare(q.h));
  if(!a.length){L.innerHTML='<div class="empty">Bu gün için randevu yok.</div>';return}
  L.innerHTML='';a.forEach(x=>{const el=document.createElement('div');el.className='appt';
    el.innerHTML=`<div class="time">${x.h}</div><div class="info"><div class="name">${x.n||'Müşteri'}</div><div class="sub">${x.amt!=null?'<span class="paid">✓ '+tl(x.amt)+'</span>':'Bekliyor'}</div></div>`;
    if(x.p&&x.amt==null){const w=document.createElement('button');w.className='btn w';w.textContent='💬';w.onclick=e=>{e.stopPropagation();wa(x)};el.appendChild(w)}
    const b=document.createElement('button');b.className='btn g';b.textContent=x.amt!=null?'Düzelt':'₺ Gir';
    b.onclick=e=>{e.stopPropagation();openPay(x)};el.appendChild(b);
    el.onclick=()=>openAdd(x);L.appendChild(el)})
}
function renderKasa(){
  const now=new Date(),t=ymd(now),m=t.slice(0,7);const ws=new Date(now);ws.setDate(now.getDate()-((now.getDay()+6)%7));const wk=ymd(ws);
  const p=db.a.filter(x=>x.amt!=null);const sum=f=>p.filter(f).reduce((s,x)=>s+x.amt,0);
  $('#sT').textContent=tl(sum(x=>x.d===t));$('#sW').textContent=tl(sum(x=>x.d>=wk&&x.d<=t));
  $('#sM').textContent=tl(sum(x=>x.d.startsWith(m)));$('#sC').textContent=p.filter(x=>x.d.startsWith(m)).length;
  const days={};p.forEach(x=>{days[x.d]=(days[x.d]||0)+x.amt});
  const ks=Object.keys(days).sort().reverse().slice(0,30);
  $('#hist').innerHTML=ks.length?ks.map(k=>{const d=new Date(k+'T12:00');return `<div class="appt"><div class="info"><div class="name">${d.toLocaleDateString('tr-TR',{day:'numeric',month:'long',weekday:'long'})}</div><div class="sub">${p.filter(x=>x.d===k).length} randevu</div></div><div class="time" style="color:var(--gold)">${tl(days[k])}</div></div>`}).join(''):'<div class="empty">Henüz tutar girilmedi.</div>'
}
function render(){renderDays();renderList();renderKasa()}

function openAdd(x){editId=x?x.id:null;$('#mT').textContent=x?'Randevuyu düzenle':'Yeni randevu';
  $('#fD').value=x?x.d:sel;$('#fH').value=x?x.h:'';$('#fN').value=x?x.n||'':'';$('#fP').value=x?x.p||'':'';
  $('#del').style.display=x?'block':'none';$('#mAdd').classList.add('on')}
function openPay(x){payId=x.id;$('#payWho').textContent=x.h+' · '+(x.n||'Müşteri');$('#fA').value=x.amt??'';$('#mPay').classList.add('on');setTimeout(()=>$('#fA').focus(),200)}
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>b.closest('.modal').classList.remove('on'));
$('#add').onclick=()=>openAdd();
$('#save').onclick=()=>{const d=$('#fD').value,h=$('#fH').value;if(!d||!h){toast('Tarih ve saat gerekli');return}
  const o={d,h,n:$('#fN').value.trim(),p:$('#fP').value.trim()};
  if(editId){Object.assign(db.a.find(x=>x.id===editId),o)}else{db.a.push({id:Date.now()+'',...o,amt:null})}
  save();sel=d;$('#mAdd').classList.remove('on');render();toast('Randevu kaydedildi')};
$('#del').onclick=()=>{if(confirm('Randevu silinsin mi?')){db.a=db.a.filter(x=>x.id!==editId);save();$('#mAdd').classList.remove('on');render()}};
$('#paySave').onclick=()=>{const v=parseFloat(($('#fA').value||'').replace(',','.'));const x=db.a.find(y=>y.id===payId);
  x.amt=isNaN(v)?null:v;save();$('#mPay').classList.remove('on');render();toast(isNaN(v)?'Tutar silindi':'Kasaya eklendi: '+tl(v))};

function wa(x){let p=x.p.replace(/\D/g,'');if(p.startsWith('0'))p='90'+p.slice(1);else if(!p.startsWith('90'))p='90'+p;
  const d=new Date(x.d+'T12:00');const gun=x.d===ymd(new Date())?'bugün':d.toLocaleDateString('tr-TR',{day:'numeric',month:'long',weekday:'long'});
  const m=`Merhaba${x.n?' '+x.n:''}, Bedber Erkek Kuaförü'nde ${gun} saat ${x.h} randevunuzu hatırlatırız. Görüşmek üzere!`;
  location.href='https://wa.me/'+p+'?text='+encodeURIComponent(m)}

document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));t.classList.add('on');
  const k=t.dataset.v==='k';$('#vr').style.display=k?'none':'';$('#vk').style.display=k?'':'none';$('#title').textContent=k?'Kasa':'Randevular';render()});

/* --- Sesle randevu --- */
const GUNLER={pazartesi:1,salı:2,sali:2,çarşamba:3,carsamba:3,perşembe:4,persembe:4,cuma:5,cumartesi:6,pazar:0};
const SAYI={bir:1,iki:2,üç:3,uc:3,dört:4,dort:4,beş:5,bes:5,altı:6,alti:6,yedi:7,sekiz:8,dokuz:9,on:10,'on bir':11,'on iki':12,yarım:30,buçuk:30};
function parse(t){
  let s=' '+t.toLocaleLowerCase('tr-TR').replace(/[.,!?]/g,' ')+' ';
  Object.entries({'on bir':'11','on iki':'12'}).forEach(([k,v])=>s=s.replace(' '+k+' ',' '+v+' '));
  const d=new Date();let dayWord=[];
  if(/\böbür gün\b|\bertesi gün\b/.test(s)){d.setDate(d.getDate()+2);dayWord=['öbür gün','ertesi gün']}
  else if(s.includes(' yarın')){d.setDate(d.getDate()+1);dayWord=['yarın']}
  else if(s.includes(' bugün')){dayWord=['bugün']}
  else{for(const[g,n]of Object.entries(GUNLER)){if(new RegExp(' '+g+'(ya|ye|a|e|ı|i|ü|u)? ').test(s)&&!(g==='pazar'&&s.includes('pazartesi'))){let k=(n-d.getDay()+7)%7||7;d.setDate(d.getDate()+k);dayWord=[g];break}}}
  let h=null,mi=0,m;
  if(m=s.match(/(\d{1,2})[:.](\d{2})/)){h=+m[1];mi=+m[2]}
  else if(m=s.match(/(?:saat\s*)?(\d{1,2})(?:'?(?:e|a|ye|ya|de|da|te|ta|da))?\s*(buçuk|yarım)?/)){h=+m[1];if(m[2])mi=30}
  else{for(const[w,n]of Object.entries(SAYI)){if(n<=12&&new RegExp(' '+w+"('?(e|a|ye|ya))? ").test(s)){h=n;break}} if(/buçuk/.test(s))mi=30}
  if(h==null)return null;
  if(/akşam|öğleden sonra/.test(s)&&h<12)h+=12; else if(h>=1&&h<=7&&!/sabah/.test(s))h+=12;
  let name=s.replace(/\d{1,2}[:.]\d{2}/g,' ').replace(/\d+('?\w+)?/g,' ')
    .replace(/\b(saat|randevu|randevusu|randevuya|ekle|yaz|kaydet|için|icin|bugün|yarın|öbür|ertesi|gün|akşam|sabah|öğleden|sonra|buçuk|yarım|de|da|ye|ya|e|a)\b/g,' ');
  Object.keys(GUNLER).forEach(g=>name=name.replace(new RegExp('\\b'+g+'\\w*','g'),' '));
  Object.keys(SAYI).forEach(w=>name=name.replace(new RegExp(' '+w+"('?\\w*)? ",'g'),' '));
  name=name.replace(/\s+/g,' ').trim().replace(/'.*$/,'');
  name=name.split(' ').filter(Boolean).map(w=>w.charAt(0).toLocaleUpperCase('tr-TR')+w.slice(1)).join(' ');
  return{d:ymd(d),h:pad(h)+':'+pad(mi),n:name}
}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
$('#mic').onclick=()=>{
  if(!SR){toast('Bu tarayıcı sesi desteklemiyor, ＋ ile ekleyin');openAdd();return}
  const r=new SR();r.lang='tr-TR';r.interimResults=false;r.maxAlternatives=1;
  const b=$('#mic');b.classList.add('rec');toast('Dinliyorum… “yarın saat 8'e Ahmet”');
  r.onresult=e=>{const t=e.results[0][0].transcript;const p=parse(t);
    if(!p){toast('Saati anlayamadım: “'+t+'”');openAdd();return}
    db.a.push({id:Date.now()+'',d:p.d,h:p.h,n:p.n,p:'',amt:null});save();sel=p.d;render();
    const dd=new Date(p.d+'T12:00');toast('✓ '+dd.toLocaleDateString('tr-TR',{day:'numeric',month:'long',weekday:'long'})+' '+p.h+(p.n?' · '+p.n:'')+' randevu hazır')};
  r.onerror=e=>toast('Ses alınamadı ('+e.error+')');r.onend=()=>b.classList.remove('rec');r.start()};

$('#exp').onclick=()=>{const b=new Blob([JSON.stringify(db)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='bedber-yedek-'+ymd(new Date())+'.json';a.click()};
$('#imp').onclick=()=>$('#file').click();
$('#file').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{const j=JSON.parse(t);if(j.a){db=j;save();render();toast('Yedek yüklendi')}}catch{toast('Dosya okunamadı')}})};
render();
</script>
</body>
</html>
